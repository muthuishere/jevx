# Install smoke: after every release, install the PUBLISHED release the way users do (install.sh, install.cmd, npm) on
# Linux, macOS and Windows, then check the version, the agent skill, and a real call that comes back as a verdict.
# The call goes to scripts/smoke_stub.py, a local contract stub (no key, no model): this proves install and wiring,
# not the hosted model's answers.
#
# Triggers: workflow_run fires when the release workflow finishes (npm included). `release: published` would never fire
# here, because release.yml creates the release with GITHUB_TOKEN and GitHub starts no workflows from that token's
# events. A push that changes the smoke itself re-runs it against the latest release, so a fix is proven without a
# manual dispatch (which needs repo admin).
name: install smoke
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  push:
    branches: [main]
    paths: [.github/workflows/smoke.yml, scripts/smoke_check.sh, scripts/smoke_stub.py, install.sh, install.cmd]
  workflow_dispatch:
    inputs:
      version:
        description: release tag to install, e.g. v0.12.2
        required: true
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: [script, npm]
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ inputs.version || github.event.workflow_run.head_branch }} # empty on push: the latest release
      JEVX_NO_HOOK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            install.sh
            install.cmd
          sparse-checkout-cone-mode: false
      - name: version under test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$VER" ] || VER=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "testing $VER"
      - uses: actions/setup-node@v4
        if: matrix.channel == 'npm'
        with:
          node-version: 22
      - name: install.sh
        if: matrix.channel == 'script' && runner.os != 'Windows'
        run: |
          # on a push the installer under test is the pushed one (the site may not be redeployed yet)
          if [ "$GITHUB_EVENT_NAME" = push ]; then JEVX_VERSION="$VER" sh install.sh
          else curl -fsSL https://muthuishere.github.io/jevx/install.sh | JEVX_VERSION="$VER" sh; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install.cmd
        if: matrix.channel == 'script' && runner.os == 'Windows'
        shell: cmd
        run: |
          if not "%GITHUB_EVENT_NAME%"=="push" (curl -fsSLo install.cmd https://muthuishere.github.io/jevx/install.cmd || exit /b 1)
          set JEVX_VERSION=%VER%
          call install.cmd || exit /b 1
          echo %LOCALAPPDATA%\Programs\jevx>>%GITHUB_PATH%
      - name: npm
        if: matrix.channel == 'npm'
        shell: bash
        run: |
          # wait (up to 8 min) until the registry serves this version's tarball, not only lists it: on v0.12.11 the
          # registry dated the version 2 min after `npm publish` returned and the old 2-min wait failed two jobs
          for i in $(seq 1 24); do
            url=$(npm view "@muthuishere/jevx@${VER#v}" dist.tarball 2>/dev/null) && [ -n "$url" ] && curl -fsI "$url" >/dev/null && break
            echo "npm: ${VER#v} not served yet ($i/24)"; sleep 20
          done
          # right after a publish the registry can list a version before every mirror serves it: retry, and put npm's
          # own error on the run page if it still fails
          for i in 1 2 3 4 5; do
            npm i -g "@muthuishere/jevx@${VER#v}" > npm.out 2>&1 && { tail -3 npm.out; exit 0; }
            echo "npm install attempt $i failed; retrying in 30 s"; sleep 30
          done
          cat npm.out
          grep -v '^npm notice' npm.out | tail -6 | while IFS= read -r l; do echo "::error title=npm install ($RUNNER_OS)::$l"; done
          exit 1
      - name: check
        shell: bash
        run: scripts/smoke_check.sh "$VER"
