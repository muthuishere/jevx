# Build the Astro/Starlight docs site in site/ and deploy it to GitHub Pages
# (same shape as the cljgo and toolnexus docs workflows).
#
# The installers and the agent skill are copied into site/public/ at build time,
# so https://muthuishere.github.io/jevx/install.sh, install.cmd and skill.md keep
# resolving without duplicating those files in git.
#
# ENABLE ONCE: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy Pages

on:
  push:
    tags: ["v*"] # every release rebuilds the site, so the header version and the docs match the release
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "install.cmd"
      - "cmd/**/skill/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the header version is the newest tag (git describe)

      - name: Copy installers and skill into the site root
        run: |
          cp install.sh install.cmd site/public/
          for d in cmd/jevx cmd/jevcli; do
            if [ -f "$d/skill/SKILL.md" ]; then cp "$d/skill/SKILL.md" site/public/skill.md; break; fi
          done
          test -f site/public/skill.md || { echo "no SKILL.md under cmd/jevx or cmd/jevcli" >&2; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # When a push changes an installer, check the installer mirror once its edge cache (up to 10 min) has expired:
  # each file must answer 200 with no redirect and be byte-identical to the file in this commit.
  installer-mirror:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      MIRROR: https://jevx.deemwar.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check the mirrored installers
        run: |
          before=${{ github.event.before }}
          if [ "${{ github.event_name }}" = push ] && ! echo "$before" | grep -q '^0*$' && \
             ! git diff --name-only "$before" "$GITHUB_SHA" | grep -qx 'install\.sh\|install\.cmd'; then
            echo "no installer change in this push"; exit 0
          fi
          sleep 660
          for f in install.sh install.cmd; do
            curl -sS -D h.txt -o got "$MIRROR/$f?nocache=$GITHUB_RUN_ID"
            grep -q '^HTTP/[0-9.]* 200' h.txt || { echo "::error::$MIRROR/$f is not 200"; cat h.txt; exit 1; }
            ! grep -qi '^location:' h.txt || { echo "::error::$MIRROR/$f redirects"; exit 1; }
            [ "$(sha256sum < got)" = "$(sha256sum < $f)" ] || { echo "::error::$MIRROR/$f differs from this commit"; exit 1; }
            echo "$MIRROR/$f: 200, identical"
          done
