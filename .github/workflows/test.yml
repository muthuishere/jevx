# go vet + go test on every push to main and every pull request, on the three OSes jevx ships for.
# It includes TestDocsUsageLinesMatchBinary, so a docs page that quotes a stale usage line fails here, not in a user's
# terminal.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test
        shell: bash
        # failing tests become annotations, so they show on the run page without opening the log
        run: |
          # Linux also runs the race detector (it needs cgo, which the Linux runner has); the batch test then builds a
          # race-enabled jevx and runs a parallel batch through it
          race=; [ "$RUNNER_OS" = Linux ] && race=-race
          go test $race ./... > test.out 2>&1 && { tail -3 test.out; exit 0; }
          cat test.out
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:|^FAIL|DATA RACE' test.out | head -40 | while IFS= read -r l; do
            echo "::error title=go test ($RUNNER_OS)::$l"
          done
          exit 1
