# go vet + go test on every push to main and every pull request, on the three OSes jevx ships for.
# It includes TestDocsUsageLinesMatchBinary, so a docs page that quotes a stale usage line fails here, not in a user's
# terminal.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
